# Render blueprint for the Motor Insurance Pricing API.
#
# Deploy: push genai-insurance-pricing/ to GitHub, then in Render:
#   New -> Blueprint -> select the repo -> it reads this file.
#
# The model artifacts (models/*.joblib + model_metadata.json) are committed
# to the repo, so no external model hosting is required.

services:
  - type: web
    name: motor-insurance-pricing-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.9
      # Supabase credentials. Set these in the Render dashboard (or via
      # "New -> Blueprint" env var prompts) after creating the project.
      # The API degrades gracefully when they are absent (no quote saving).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false