[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-insurance-pricing"
version = "0.2.0"
description = "Production-ready motor insurance pricing system with API, CLI, and Streamlit UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "joblib",
  "matplotlib",
  "numpy",
  "pandas",
  "pydantic>=2.0.0",
  "scikit-learn",
  "seaborn",
  "streamlit>=1.25.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pre-commit>=4.0.0",
  "pytest>=8.0.0",
  "pytest-timeout>=2.3.0",
]
lint = [
  "mypy>=1.11.0",
  "ruff>=0.6.0",
]
all = [
  "motor-insurance-pricing[dev,lint,xgboost]",
]
xgboost = ["xgboost>=2.0.0"]

[project.urls]
Homepage = "https://github.com/anomalyco/genai-insurance-pricing"
Source = "https://github.com/anomalyco/genai-insurance-pricing"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
timeout = 120

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
disallow_untyped_defs = false
