services:
  train:
    build: .
    command: python -m scripts.train
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONHASHSEED=42

  api:
    build: .
    command: uvicorn scripts.serve:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONHASHSEED=42

  streamlit:
    build: .
    command: streamlit run app.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONHASHSEED=42
